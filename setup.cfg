[flake8]
ignore = W503
exclude =
    tests/,
    */migrations/,
    data/,
    **/venv/,
    env/,
    docs/,
    frontend/,
    infra/,
    __pycache__/
per-file-ignores =
    */settings.py:E501
max-line-length = 119

[isort]
src_paths = backend
known_django = django
known_third_party = rest_framework, djoser, django_filters, corsheaders, drf_extra_fields
sections = FUTURE, STDLIB, DJANGO, THIRDPARTY, FIRSTPARTY, LOCALFOLDER
skip_glob = */migrations/*, */venv/*, */env/*, */__pycache__/*
line_length = 119
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
