volumes:
  pg_data:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: arthas96/foodgram_backend:latest
    env_file: .env
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
    depends_on:
      - db
    restart: always

  frontend:
    image: arthas96/foodgram_frontend:latest
    command: cp -r /app/build/. /static/
    volumes:
      - static_volume:/static/

  gateway:
    image: arthas96/foodgram_gateway:latest
    env_file: .env
    ports:
      - "9001:80"
    volumes:
      - static_volume:/static/
      - media_volume:/media/
    depends_on:
      - backend
    restart: always
